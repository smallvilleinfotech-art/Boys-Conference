<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Boys’ Conference · Registration Desk</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#151515;--mut:#6b6b6b;--navy:#151515;--gold:#ff9800;--ok:#0b8f5a;--bad:#d6334a;--line:#e8e2d6;--in:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1c1c1c;--ink:#f3f3f3;--mut:#a0a0a0;--line:#333;--in:#121212;--navy:#000;--ok:#3ecf8e;--bad:#ff6b81;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--card:#1c1c1c;--ink:#f3f3f3;--mut:#a0a0a0;--line:#333;--in:#121212;--navy:#000;--ok:#3ecf8e;--bad:#ff6b81;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#fff;color:#151515;padding:10px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:5px solid var(--gold)}header img{height:48px;width:auto}header b{font:800 15px system-ui,"Segoe UI",Arial,sans-serif;letter-spacing:.5px;text-transform:uppercase}
header input{width:180px;background:#fff;color:#151515;border-color:#d8d2c4}
nav{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:20px;font-weight:600;cursor:pointer}nav button.on{background:var(--gold);color:#151515;border-color:#151515}
main{padding:14px;max-width:1000px;margin:auto}
input,select,button{font:inherit}input,select{background:var(--in);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.row>button{flex:0 0 auto}
.btn{background:var(--gold);color:#151515;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}.btn.g{background:var(--ok);color:#fff}.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.4}
.res{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card);cursor:pointer}.res:hover{border-color:var(--gold)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--line);color:var(--ink);white-space:nowrap}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.mut{color:var(--mut);font-size:13px}
.chk{display:flex;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}.chk input{width:20px;height:20px;padding:0}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kp div{background:var(--navy);color:#fff;border-radius:12px;padding:14px;border-bottom:3px solid var(--gold)}.kp b{display:block;font:800 28px system-ui,Arial,sans-serif}.kp span{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--gold)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
h2,h3{margin:0 0 8px;font-weight:800}
</style></head><body>

const CL={1:'Ajah–Lekki',2:'New Road–Adeba',3:'Lakowe–Ibeju',4:'Epe',0:'Unassigned'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=null,st={sc:{},ind:{},arr:[],log:[]},tab='in',sel=null,cen='',q='';
try{$('#who').value=localStorage.getItem('who')||''}catch(e){}
$('#who').oninput=e=>{try{localStorage.setItem('who',e.target.value)}catch(x){}};
const tm=d=>new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const g=s=>st.sc[s.id]||{},exp=s=>s.t=='P'?s.x:s.s.length,appr=s=>g(s).ap!=null?g(s).ap:s.a;
const pres=s=>g(s).n!=null?g(s).n:(g(s).p||[]).length+(g(s).add||[]).length;
const who=()=>{const w=$('#who').value.trim();if(!w){$('#who').focus();alert('Enter your name at the top first, so every change is logged.');}return w};
function lg(m){db.collection('log').add({at:new Date().toISOString(),by:$('#who').value.trim(),m})}
function sset(s,patch,m){const w=who();if(!w||!db)return;const o={...g(s),...patch,nm:s.n,ex:exp(s)};st.sc[s.id]=o;db.collection('schools').doc(s.id).set(o);if(m)lg(m);render()}
function iset(i,v){const w=who();if(!w||!db)return;const o=v?{in:1,at:new Date().toISOString(),by:w,nm:i.n}:{in:0,nm:i.n};st.ind[i.id]=o;db.collection('inds').doc(i.id).set(o);lg((v?'Checked in ':'Undid check-in for ')+i.n);render()}
function nav(){$('#nav').innerHTML=[['in','Check-in'],['vc','Viewing centre'],['db','Dashboard']].map(t=>`<button class="${tab==t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}
$('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
function render(){nav();$('#app').innerHTML=tab=='in'?vIn():tab=='vc'?vVc():vDb();if(tab=='in'){const i=$('#q');if(i){i.value=q;if(document.activeElement!==i&&!sel)i.focus()}}}
function vIn(){const t=q.toLowerCase().split(/\s+/).filter(Boolean);let h=`<div class="card"><input id="q" placeholder="School: type one word of the name · Boy: type his name" oninput="q=this.value;sel=null;upd()"></div><div id="res">${res(t)}</div><div id="pn">${sel?pn():''}</div>`;return h}
function upd(){const t=q.toLowerCase().split(/\s+/).filter(Boolean);$('#res').innerHTML=res(t);$('#pn').innerHTML=''}
function res(t){if(!t.length)return '<p class="mut">Start typing. Schools match on any word in the name; boys match on his name.</p>';
 const S=D.S.filter(s=>t.every(x=>s.n.toLowerCase().includes(x))).slice(0,8),I=D.I.filter(i=>t.every(x=>i.n.toLowerCase().includes(x))).slice(0,8);
 if(!S.length&&!I.length)return '<p class="mut">No registration found. Check the spelling, or this person/school is not registered.</p>';
 return S.map(s=>`<div class="res" onclick="pick('s','${s.id}')"><span><b>${esc(s.n)}</b><br><span class="mut">School · ${CL[s.c]} · expects ${exp(s)}</span></span><span class="${appr(s)?'ok':'bad'}">${appr(s)?'Approved':'Not approved'}${g(s).ok?' · Locked':''}</span></div>`).join('')+I.map(i=>`<div class="res" onclick="pick('i','${i.id}')"><span><b>${esc(i.n)}</b><br><span class="mut">Individual · ${esc(i.id)} · ${esc(i.sc)} · ${esc(i.loc)}</span></span><span class="${st.ind[i.id]?.in?'ok':'mut'}">${st.ind[i.id]?.in?'Checked in':'Not in yet'}</span></div>`).join('')}
function pick(k,id){sel={k,id};$('#pn').innerHTML=pn();$('#pn').scrollIntoView({behavior:'smooth'})}
function pn(){if(sel.k=='i'){const i=D.I.find(x=>x.id==sel.id),c=st.ind[i.id]||{};return `<div class="card"><h2>${esc(i.n)}</h2><p class="mut">${esc(i.id)} · Age ${esc(i.age)} · ${esc(i.cl)} · ${esc(i.sc)} (${esc(i.loc)}) · Guardian ${esc(i.g)} ${esc(i.ph)}</p>${c.in?`<p class="ok">Checked in at ${tm(c.at)} by ${esc(c.by)}</p><button class="btn o" onclick="iset(D.I.find(x=>x.id=='${i.id}'),0)">Undo</button>`:`<button class="btn g" onclick="iset(D.I.find(x=>x.id=='${i.id}'),1)">Confirm &amp; check in</button>`}</div>`}
 const s=D.S.find(x=>x.id==sel.id),c=g(s),L=!!c.ok,p=c.p||[],a=c.add||[],d=pres(s)-exp(s);
 return `<div class="card"><h2>${esc(s.n)}</h2><p><span class="tag">${CL[s.c]}</span> <span class="tag">${s.t=='A'?'AFED':s.t=='P'?'Public school':'Other school'}</span> <span class="${appr(s)?'ok':'bad'}">${appr(s)?'APPROVED':'NOT APPROVED TO ATTEND'}</span> <button class="btn o" style="padding:4px 10px" ${L?'disabled':''} onclick="sset(D.S.find(x=>x.id=='${s.id}'),{ap:${appr(s)?0:1}},'${appr(s)?'Revoked':'Approved'} ${esc(s.n).replace(/'/g,'’')}')">${appr(s)?'Revoke':'Approve'}</button></p>
 <p class="mut">${esc(s.ad||'')}${s.ct?' · '+esc(s.ct):''}<br>${esc(s.r)}${s.f?` · Form count ${s.f}`:''}${s.ph?` · Contact ${esc(s.ph)}`:''}</p>
 <div class="kp"><div><span>Expected</span><b>${exp(s)}</b></div><div><span>Present</span><b>${pres(s)}</b></div><div><span>Difference</span><b>${d>0?'+':''}${d}</b></div></div>
 ${s.s.length?`<h3 style="margin-top:14px">Expected boys</h3>`+s.s.map((n,i)=>`<label class="chk"><input type="checkbox" ${p.includes(i)?'checked':''} ${L?'disabled':''} onchange="tg('${s.id}',${i},this.checked)">${esc(n)}</label>`).join(''):'<p class="mut">No name list yet. Enter the head count below.</p>'}
 ${a.length?`<h3 style="margin-top:14px">Walk-ins added</h3>`+a.map((n,i)=>`<div class="chk">${esc(n)} <button class="btn o" style="padding:2px 8px;margin-left:auto" ${L?'disabled':''} onclick="rm('${s.id}',${i})">remove</button></div>`).join(''):''}
 <div class="row" style="margin-top:12px"><input id="wi" placeholder="Add a boy not on the list" ${L?'disabled':''}><button class="btn" ${L?'disabled':''} onclick="addw('${s.id}')">Add</button></div>
 <div class="row" style="margin-top:8px"><input id="cn" type="number" min="0" placeholder="Or set the present count directly" value="${c.n!=null?c.n:''}" ${L?'disabled':''}><button class="btn o" ${L?'disabled':''} onclick="setn('${s.id}')">Set count</button></div>
 <div class="row" style="margin-top:14px">${L?`<span class="ok">Locked: ${pres(s)} of ${exp(s)} confirmed by ${esc(c.by)} at ${tm(c.at)}</span><button class="btn o" onclick="sset(D.S.find(x=>x.id=='${s.id}'),{ok:0},'Unlocked ${esc(s.n).replace(/'/g,'’')}')">Unlock</button>`:`<button class="btn g" onclick="lock('${s.id}')">Confirm &amp; lock ${pres(s)} boys</button>`}</div></div>`}
const S1=id=>D.S.find(x=>x.id==id);
function tg(id,i,on){const s=S1(id),p=new Set(g(s).p||[]);on?p.add(i):p.delete(i);sset(s,{p:[...p],n:null},null);}
function addw(id){const v=$('#wi').value.trim();if(!v)return;const s=S1(id);sset(s,{add:[...(g(s).add||[]),v],n:null},`Walk-in added to ${s.n}: ${v}`)}
function rm(id,i){const s=S1(id),a=[...(g(s).add||[])];a.splice(i,1);sset(s,{add:a,n:null},null)}
function setn(id){const v=$('#cn').value;if(v==='')return;const s=S1(id);sset(s,{n:+v},`${s.n}: present count set to ${v} (expected ${exp(s)})`)}
function lock(id){const s=S1(id),w=who();if(!w)return;sset(s,{ok:1,at:new Date().toISOString(),by:w},`LOCKED ${s.n}: ${pres(s)} of ${exp(s)} confirmed`)}
function vVc(){const c=D.C.find(x=>x.id==cen),A=st.arr.filter(a=>a.c==cen).sort((a,b)=>b.at.localeCompare(a.at)),d=new Date();
 return `<div class="card"><h3>Select your viewing centre</h3><select onchange="cen=this.value;render()"><option value="">Choose…</option>${D.C.map(x=>`<option value="${x.id}" ${x.id==cen?'selected':''}>${esc(x.o)} · ${esc(x.l)}</option>`).join('')}</select></div>`+(c?`<div class="card"><h2>${esc(c.o)}</h2><p class="mut">${esc(c.l)} · Target ${c.t} boys</p><div class="kp"><div><span>Boys present</span><b>${A.filter(a=>a.role=='boy').length}</b></div><div><span>Coordinators</span><b>${A.filter(a=>a.role!='boy').length}</b></div></div></div>
 <div class="card"><h3>Log an arrival</h3><div class="row"><select id="vr"><option value="boy">Boy</option><option value="co">Coordinator</option></select><input id="vn" placeholder="Name"><input id="vs" placeholder="School (boys)"><input id="va" type="number" placeholder="Age (boys)"><input id="vt" type="time" value="${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}"><button class="btn g" onclick="addA()">Save</button></div></div>
 <div class="card sc"><table><tr><th>Time</th><th>Name</th><th>School</th><th>Age</th><th>Type</th><th></th></tr>${A.map(a=>`<tr><td>${tm(a.at)}</td><td>${esc(a.nm)}</td><td>${esc(a.sc)}</td><td>${esc(a.age)}</td><td>${a.role=='boy'?'Boy':'Coordinator'}</td><td><button class="btn o" style="padding:2px 8px" onclick="db.collection('arr').doc('${a.id}').delete()">×</button></td></tr>`).join('')||'<tr><td colspan=6 class="mut">No arrivals yet.</td></tr>'}</table></div>`:'')}
function addA(){const n=$('#vn').value.trim();if(!n||!db)return;const t=new Date(),[h,m]=($('#vt').value||'00:00').split(':');t.setHours(+h,+m,0,0);db.collection('arr').add({c:cen,nm:n,sc:$('#vs').value.trim(),age:$('#va').value,role:$('#vr').value,at:t.toISOString()});['#vn','#vs','#va'].forEach(i=>$(i).value='')}
function vDb(){const ap=D.S.filter(appr),eS=ap.reduce((a,s)=>a+exp(s),0),L=D.S.filter(s=>g(s).ok),iS=L.reduce((a,s)=>a+pres(s),0),iI=Object.values(st.ind).filter(x=>x.in).length,net=L.reduce((a,s)=>a+pres(s)-exp(s),0),pc=(a,b)=>b?Math.min(100,a/b*100):0;
 const rows=[1,2,3,4,0].map(c=>{const z=ap.filter(s=>s.c==c);if(!z.length)return '';const e=z.reduce((a,s)=>a+exp(s),0),p=z.filter(s=>g(s).ok).reduce((a,s)=>a+pres(s),0);return `<tr><td>${CL[c]}</td><td>${z.length}</td><td>${e}</td><td>${p}<div class="bar"><i style="width:${pc(p,e)}%"></i></div></td></tr>`}).join('');
 const cs=D.C.map(c=>{const A=st.arr.filter(a=>a.c==c.id);if(!A.length)return '';const b=A.filter(a=>a.role=='boy').length,t=A.map(a=>a.at).sort();return `<tr><td>${esc(c.o)}<br><span class="mut">${esc(c.l)}</span></td><td>${b}<div class="bar"><i style="width:${pc(b,c.t)}%"></i></div></td><td>${A.length-b}</td><td>${tm(t[0])} – ${tm(t[t.length-1])}</td></tr>`}).join('');
 return `<div class="kp"><div><span>Boys in hall</span><b>${iS+iI}</b></div><div><span>Expected (approved)</span><b>${eS+D.I.length}</b></div><div><span>Schools locked</span><b>${L.length}/${ap.length}</b></div><div><span>Individuals in</span><b>${iI}/${D.I.length}</b></div><div><span>Net adjustment</span><b>${net>0?'+':''}${net}</b></div><div><span>Boys at viewing centres</span><b>${st.arr.filter(a=>a.role=='boy').length}</b></div></div>
 <div class="card sc"><h3>Hall by cluster (approved schools)</h3><table><tr><th>Cluster</th><th>Schools</th><th>Expected</th><th>Confirmed in</th></tr>${rows}</table></div>
 <div class="card sc"><h3>Viewing centres</h3><table><tr><th>Centre</th><th>Boys present</th><th>Coordinators</th><th>Arrivals</th></tr>${cs||'<tr><td colspan=4 class="mut">No arrivals logged yet.</td></tr>'}</table></div>
 <div class="card"><h3>Latest activity</h3>${st.log.slice(0,10).map(l=>`<div class="chk"><span class="mut">${tm(l.at)}</span> ${esc(l.m)} <span class="mut" style="margin-left:auto">${esc(l.by)}</span></div>`).join('')||'<p class="mut">Nothing yet.</p>'}</div>`}
function sr(){const a=document.activeElement;if(a&&['wi','cn','vn','vs','va','vt'].includes(a.id)&&a.value)return;render()}
const CFG={URL:'https://script.google.com/macros/s/AKfycbxdwpARTJ7DcVRSAxNNT1bDbsghMEpZV3BpFKMpBUWnKbaQ-U8l5zQ3U-aXcIgcPZFA/exec'};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){const p=$('#pw').value;try{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);D=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.i)},key,b64(ENC.c))));PW=p;try{sessionStorage.setItem('pw',p)}catch(e){}}catch(e){$('#le').textContent='Wrong passcode.';return}
$('#lock').hidden=true;$('#app').hidden=false;$('#nav').hidden=false;boot()}
$('#go').onclick=unlock;$('#pw').onkeydown=e=>{if(e.key=='Enter')unlock()};try{const p=sessionStorage.getItem('pw');if(p){$('#pw').value=p;unlock()}}catch(e){}
let LS={docs:{},out:[],since:0};try{LS={...LS,...JSON.parse(localStorage.getItem('btk_v1')||'{}')}}catch(e){}
const subs=[],sv=()=>{try{localStorage.setItem('btk_v1',JSON.stringify(LS))}catch(e){}};
const snap=(c,o)=>{let d=Object.keys(LS.docs).filter(k=>k.startsWith(c+'/')&&!LS.docs[k]._d).map(k=>{const{_t,...r}=LS.docs[k];return{id:k.slice(c.length+1),data:()=>r}});if(o)d=d.sort((a,b)=>b.data().at.localeCompare(a.data().at)).slice(0,30);return{docs:d}};
const fire=()=>subs.forEach(s=>s.f(snap(s.c,s.o)));
function put(c,id,d){const k=c+'/'+id,o={...d,_t:Date.now()};LS.docs[k]=o;LS.out=LS.out.filter(x=>x.k!=k).concat({k,d:o});sv();fire();sync()}
db={collection:c=>({doc:id=>({set:d=>put(c,id,d),delete:()=>put(c,id,{_d:1})}),add:d=>put(c,Date.now().toString(36)+Math.random().toString(36).slice(2,6),d),onSnapshot:f=>{subs.push({c,f});f(snap(c))},orderBy:()=>({limit:()=>({onSnapshot:f=>{subs.push({c,f,o:1});f(snap(c,1))}})})})};
let busy=0;
async function sync(){const w=$('#warn');if(!CFG.URL.startsWith('http')){w.textContent='Local mode: changes are saved on this device only. Add the Apps Script link to share between devices.';return}
if(busy)return;if(!navigator.onLine){w.textContent=`Offline: ${LS.out.length} change(s) saved on this device, will sync when back online.`;return}busy=1;
try{const ops=LS.out.slice(),j=await(await fetch(CFG.URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:PW,ops,since:LS.since})})).json();if(!j.ok)throw j.e;
LS.out=LS.out.filter(x=>!ops.includes(x));j.r.forEach(x=>{if(!LS.out.some(o=>o.k==x.k))LS.docs[x.k]=x.d;LS.since=Math.max(LS.since,x.t)});sv();fire();w.textContent='Synced '+tm(Date.now())}
catch(e){w.textContent='Sync problem ('+(e||'network')+'): changes are kept on this device and will retry.'}busy=0}
function boot(){const m=(c,f)=>db.collection(c).onSnapshot(s=>{f(s);sr()});
m('schools',s=>{st.sc={};s.docs.forEach(d=>st.sc[d.id]=d.data())});m('inds',s=>{st.ind={};s.docs.forEach(d=>st.ind[d.id]=d.data())});m('arr',s=>{st.arr=s.docs.map(d=>({...d.data(),id:d.id}))});
db.collection('log').orderBy('at').limit(30).onSnapshot(s=>{st.log=s.docs.map(d=>d.data());if(tab=='db')sr()});render();sync();setInterval(sync,6000)}
</script></body></html>
